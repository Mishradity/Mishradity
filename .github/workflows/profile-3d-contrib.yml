name: 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Mishradity

      - name: Commit & push generated SVGs
        run: |
          git add -f profile-3d-contrib/*.svg
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m "Update 3D contribution calendar" || echo "No changes to commit"
          git push origin output || (git checkout -b output && git push origin output)
